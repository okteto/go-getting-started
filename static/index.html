    <style>
      :root {
        /* The color of the language: Go */
        --accent: #00add8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #f4f6fb;
        background: radial-gradient(circle at 50% 30%, #1d2638 0%, #0a0d14 70%);
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      .card {
        position: relative;
        width: min(420px, 100%);
        padding: 36px 32px 32px;
        overflow: hidden;
        text-align: center;
        border-radius: 6px;
        background: linear-gradient(165deg, #121a2e 0%, #0b1020 55%, var(--accent) 180%);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .hello {
        margin: 0 0 30px;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 800;
      }
      .logo {
        display: block;
        width: 46%;
        height: auto;
        margin: 0 auto;
        filter: drop-shadow(0 0 26px #00d1ca);
      }
      h1 {
        margin: 36px 0 0;
        font-size: 22px;
        line-height: 1.3;
        font-weight: 700;
      }
      .details {
        margin: 28px 0 0;
        padding-top: 18px;
        display: grid;
        /* The two details are centered as a group, and each label is aligned with its value */
        grid-template-columns: auto auto;
        justify-content: center;
        gap: 12px 44px;
        text-align: left;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .details dt {
        font-size: 11px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #9aa7c2;
      }
      .details dd { margin: 6px 0 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    </style>
  </head>

      <h1 id="message">&nbsp;</h1>
      <dl class="details">
        <div><dt>Runtime</dt><dd id="runtime">&nbsp;</dd></div>
        <div><dt>Pod</dt><dd id="pod">&nbsp;</dd></div>
      </dl>
    </main>
    <script>
      // The page asks the service for its info every second, so a change in
      // the code shows up without reloading the page.
      const show = (info) => {
        for (const key of ["message", "runtime", "pod"]) {
          document.getElementById(key).textContent = info[key];
        }
      };
      const refresh = () => fetch("api/info").then((res) => res.json()).then(show).catch(() => {});
      refresh();
      setInterval(refresh, 1000);
    </script>
