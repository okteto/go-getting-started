build:
  dev:
    context: .
    target: dev
  hello-world:
    context: .
    target: prod
    depends_on:
      - dev

deploy:
  image: alpine/helm:4.3.2
  commands:
    - helm upgrade --install hello-world chart --set image=${OKTETO_BUILD_HELLO_WORLD_IMAGE}

test:
  unit:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    caches:
      - /go/pkg/mod
      - /root/.cache/go-build
    commands:
      - go test -v -coverprofile=coverage.out ./...
    artifacts:
      - coverage.out

dev:
  hello-world:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: air
    sync:
      - .:/usr/src/app
    persistentVolume:
      enabled: false
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    forward:
      - 2345:2345
