build:
  dev:
    context: .
    target: dev
  hello-world:
    context: .
    target: prod
    depends_on:
      - dev

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

dev:
  hello-world:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: air
    sync:
      - .:/usr/src/app
    persistentVolume:
      enabled: false
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    forward:
      - 2345:2345
